<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>離島拼圖｜設定</title><style>body{margin:0;background:#eef3f5;color:#173748;font-family:"Microsoft JhengHei",sans-serif}.wrap{width:min(760px,92vw);margin:35px auto;background:#fff;padding:30px;box-shadow:0 12px 45px #17374818}h1{margin-top:0}label{display:block;font-weight:700;margin:16px 0}input{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #becdd4}small{color:#687e89}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button,a{border:0;padding:12px 17px;background:#173748;color:#fff;text-decoration:none;cursor:pointer}.secondary{background:#4b849d}#message{color:#24704c}</style></head><body><main class="wrap"><h1>離島拼圖設定</h1><p>填入三張公開圖片網址。儲存後可在同一瀏覽器預覽；下載設定檔並取代 repository 內的 <code>config.json</code>，即可正式發佈給所有玩家。</p><form id="form"><label>遊戲名稱<input id="title" required></label><label>第一關圖片 URL<input id="image1" required></label><label>第二關圖片 URL<input id="image2" required></label><label>第三關圖片 URL<input id="image3" required></label><small>必須使用 16:9 橫向相片；GitHub 圖片請使用 raw.githubusercontent.com 的公開網址。</small><div class="row"><button type="submit">儲存並預覽</button><button type="button" id="download" class="secondary">下載 config.json</button><a href="index.html" target="_blank">開啟遊戲</a></div><p id="message"></p></form></main><script>const $=s=>document.querySelector(s),fallback={title:'離島拼圖',eyebrow:'ISLAND PUZZLE',piecesPerSide:3,pointsPerLevel:200,levels:[{name:'第一關',image:'assets/level-1.svg'},{name:'第二關',image:'assets/level-2.svg'},{name:'第三關',image:'assets/level-3.svg'}]};let cfg=fallback;async function load(){try{cfg=await(await fetch('config.json',{cache:'no-store'})).json()}catch{}try{cfg={...cfg,...JSON.parse(localStorage.getItem('islandPuzzleConfig'))}}catch{}$('#title').value=cfg.title;cfg.levels.forEach((x,i)=>$('#image'+(i+1)).value=x.image)}function read(){return{...cfg,title:$('#title').value.trim(),piecesPerSide:3,pointsPerLevel:200,levels:[1,2,3].map((n,i)=>({name:['第一關','第二關','第三關'][i],image:$('#image'+n).value.trim()}))}}$('#form').onsubmit=e=>{e.preventDefault();cfg=read();localStorage.setItem('islandPuzzleConfig',JSON.stringify(cfg));$('#message').textContent='已儲存。本機預覽會使用新設定。'};$('#download').onclick=()=>{cfg=read();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}));a.download='config.json';a.click();URL.revokeObjectURL(a.href)};load();</script></body></html>
